[project]
name = "alters-vermoegen-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "streamlit>=1.63.0",
]

[project.scripts]
alters-vermoegen-dashboard = "alters_vermoegen_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.16.6",
]
