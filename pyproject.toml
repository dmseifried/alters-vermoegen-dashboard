[project]
name = "alters-vermoegen-dashboard"
version = "0.1.0"
description = "Dashboard zu internationalen Alters- und Vermögensverteilungen für die Datenvisualisierungsvorlesung."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
